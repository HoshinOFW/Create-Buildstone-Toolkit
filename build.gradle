plugins {
    id "com.github.hoshinofw.multiversion.multiversion" version "0.9.1"
    id "groovy"
    id "groovy-gradle-plugin"
    id "com.gradle.plugin-publish" version "1.3.1"

    id "idea"
    id 'com.gradleup.shadow' version '8.3.6' apply false

    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.141' apply false
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

multiversionResources {
    replaceWithString = [
            "mod_license" : mod_license.toString(),
            "mod_description" : mod_description.toString(),
            "mod_author" : mod_author.toString(),
            "bt_version": buildstone_toolkit_version.toString()
    ]

    replaceWithProperty = [
            "forge_version": "forge_version",
            "neoforge_version": "neoforge_version",
            "architectury_api_version": "architectury_api_version",
            "create_version": "create_version",
            "max_supported_create_version" : "max_supported_create_version",

            // Version compat ranges
            "fml_loader_version_range": "fml_loader_version_range",
            "forge_version_range": "forge_version_range",
            "neoforge_version_range": "neoforge_version_range",
            "buildstonetoolkit_version_range": "buildstonetoolkit_version_range",
            "create_version_range": "create_version_range",
    ]
}

multiversion.configureAll()
