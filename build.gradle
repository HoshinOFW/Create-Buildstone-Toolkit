plugins {
    id("idea")
    id("eclipse")
    id("maven-publish")
    id("net.kyori.blossom") version "2.1.0" // https://github.com/KyoriPowered/blossom
    id("dev.ithundxr.silk") version "1.0.1" // https://github.com/ithundxr/silk
    id("net.neoforged.moddev") version "2.0.107" // https://projects.neoforged.net/neoforged/ModDevGradle
    id("me.modmuss50.mod-publish-plugin") version "0.8.4" // https://github.com/modmuss50/mod-publish-plugin
    id("org.jetbrains.gradle.plugin.idea-ext") version "1.1.8" // https://github.com/JetBrains/gradle-idea-ext-plugin
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
if (false) {
    mixin {
        add sourceSets.main, 'createbuildstonetoolkit.refmap.json'
        config 'createbuildstonetoolkit.mixins.json'
    }

    jar {
        manifest.attributes([
                "MixinConfigs": "createbuildstonetoolkit.mixins.json"
        ])
    }
}


base {
    archivesName = "${rootProject.archives_name}-neoforge-${project.minecraft_version}"
    version = project.mod_version
    group = project.maven_group
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

java {
    withSourcesJar()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = neoforge_version

    validateAccessTransformers = true

    parchment {
        // Get versions from https://parchmentmc.org/docs/getting-started
        // Omit the "v"-prefix in mappingsVersion
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            jvmArgument("-XX:+IgnoreUnrecognizedVMOptions")
            jvmArgument("-XX:+AllowEnhancedClassRedefinition")
            //jvmArgument("-XX:-OmitStackTraceInFastThrow") // uncomment when you get exceptions with null messages etc
            //jvmArgument("-XX:+UnlockCommercialFeatures") // uncomment for profiling

            systemProperty("mixin.debug.verbose", "true")
            systemProperty("mixin.debug.export", "true")

            systemProperty("neoforge.enabledGameTestNamespaces", mod_id as String)
        }


        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }

    mods {
        createbuildstonetoolkit {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {url "https://maven.neoforged.net"}
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
    maven { url = "https://harleyoconnor.com/maven" } // Dynamic Trees
    maven { url = "https://maven.theillusivec4.top/" } // Curios API
    maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.ftb.dev/releases" } // FTB Mods
    maven { url = "https://maven.architectury.dev" } // Arch API
    maven {
        url = "https://jm.gserv.me/repository/maven-public" // JourneyMap
        content {
            includeGroup "info.journeymap"
            includeGroup "mysticdrew"
        }
    }
    maven {url = 'https://maven.minecraftforge.net/'}
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://mvn.devos.one/snapshots" }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}-${create_version_number}:slim") { transitive = false }
    //modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}-${create_version_number}:all")
    //modRuntimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}-${create_version_number}:slim")
    //modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}-${create_version_number}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation(jarJar("io.github.llamalad7:mixinextras-neoforge:${mixin_extras_version}"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))

    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    implementation("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    implementation("dev.architectury:architectury-neoforge:${architectury_api_version}")
    implementation("com.github.hoshinofw.buildstonetoolkit:buildstonetoolkit-neoforge-${minecraft_version}:${buildstonetoolkit_version}")

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

processResources {
    var replaceProperties = [
            mod_id          : mod_id,
            bt_version      : buildstonetoolkit_version,
            mod_version         : mod_version,
            create_version  : create_version,
            max_supported_create_version : max_supported_create_version,
            mod_name        : mod_name,
            mod_author      : mod_author,
            mod_description : mod_description,
            mod_license     : mod_license,
            minecraft_version: minecraft_version
    ]

    replaceProperties.put("file", [jarVersion: project.version])

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {

    }
}