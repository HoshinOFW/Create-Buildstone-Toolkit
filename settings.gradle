pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/' }
        maven { url = "https://maven.minecraftforge.net/"}
        maven { url = 'https://maven.parchmentmc.org' }
        maven {url = uri("https://maven.hoshinofw.net/releases")}
    }
}

plugins {
    id "com.github.hoshinofw.multiversion.multiversion-settings" version "0.6.1"
}

multiversionModules {
    versions = ["1.20.1", "1.21.1"]

    common = ['common']
    forge = ['forge']
    neoforge = ['neoforge']

    patchModules = ['forge',
                    'neoforge',
                    'common']
}

rootProject.name = 'createbuildstonetoolkit'
